<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Connect | Member Access</title><link rel="stylesheet" href="app.css"><style>body{background:#f3f6fa;color:#1b2b42}.portal-shell{max-width:1040px;margin:55px auto;padding:22px}.portal-hero{background:linear-gradient(125deg,#182943,#3e577b);border-radius:22px;color:#fff;padding:40px}.portal-hero h1{font-size:clamp(2rem,5vw,3.5rem);margin:8px 0}.portal-hero p{color:#dce6f2;max-width:650px}.portal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:22px}.portal-card{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:26px;box-shadow:0 8px 22px #1a29420c}.portal-card h2{font-size:1.25rem;margin:0 0 9px}.portal-card p{min-height:60px}.portal-card .btn{display:inline-block;margin-top:10px}.portal-back{display:inline-block;color:#f2d9a1;margin-top:12px}.portal-muted{color:#64748b}.portal-footer{margin-top:28px;color:#52647e;font-size:.9rem}</style></head><body><main class="portal-shell"><div class="portal-hero"><div class="eyebrow">CHURCH CONNECT · MEMBER ACCESS</div><h1 id="churchName">Your church, connected.</h1><p>Stay in touch with your church family. Access only the services your church has enabled.</p><a id="churchWebsite" class="portal-back" href="#" hidden>← Return to church website</a></div><div id="moduleCards" class="portal-cards"></div><p class="portal-footer">Your church may keep its own existing website. Church Connect provides secure member services separately.</p></main><script src="config.js"></script><script type="module" src="church-portal.js"></script></body></html>

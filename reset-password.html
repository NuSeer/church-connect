<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Connect | Reset password</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.json"><script src="brand-boot.js"></script></head><body>
<header class="nav"><a class="brand" href="connect.html">✦ <span data-church>Church</span></a></header>
<main class="admin-wrap"><div class="eyebrow">Account</div><h1>Reset your password</h1><p id="status" class="muted" aria-live="polite">Checking your reset link…</p>
<section class="panel"><form id="resetForm" class="hidden"><label for="newPassword">New password</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password"><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" required minlength="8" autocomplete="new-password"><div class="actions"><button class="btn" type="submit">Save new password</button></div></form>
<div id="done" class="hidden"><p>You can now sign in with your new password.</p><p><a class="btn" href="connect.html">Go to sign in</a></p></div></section></main>
<script src="config.js"></script><script type="module" src="reset-password.js"></script><script type="module" src="auth-ui.js"></script></body></html>
